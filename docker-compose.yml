services:
  db:
    image: postgres:17-alpine
    container_name: event_booking_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: event_booking_db
      POSTGRES_USER: event_booking_user
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "6000:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U event_booking_user -d event_booking_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: event_booking_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: event_booking_db
      POSTGRES_USER: event_booking_user
      POSTGRES_PASSWORD: local_dev_password
      DB_HOST: db
      DB_PORT: "5432"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
