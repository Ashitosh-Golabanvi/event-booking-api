components:
  schemas:
    Booking:
      type: object
      properties:
        booking_reference:
          type: string
          readOnly: true
        event_title:
          type: string
          readOnly: true
        event_start_datetime:
          type: string
          format: date-time
          readOnly: true
        seats:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/Status637Enum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - booking_reference
      - created_at
      - event_start_datetime
      - event_title
      - seats
      - status
    BookingCreate:
      type: object
      properties:
        event_id:
          type: integer
        seats:
          type: integer
          maximum: 5
          minimum: 1
      required:
      - event_id
      - seats
    Event:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        description:
          type: string
        venue:
          type: string
          maxLength: 255
        city:
          type: string
          maxLength: 100
        start_datetime:
          type: string
          format: date-time
        end_datetime:
          type: string
          format: date-time
        capacity:
          type: integer
          maximum: 2147483647
          minimum: 0
        ticket_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        status:
          allOf:
          - $ref: '#/components/schemas/EventStatusEnum'
          readOnly: true
        organizer:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          readOnly: true
        booked_seats:
          type: integer
          readOnly: true
        remaining_seats:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - booked_seats
      - capacity
      - city
      - created_at
      - description
      - end_datetime
      - id
      - organizer
      - remaining_seats
      - start_datetime
      - status
      - title
      - updated_at
      - venue
    EventStatusEnum:
      enum:
      - draft
      - published
      - cancelled
      type: string
      description: |-
        * `draft` - Draft
        * `published` - Published
        * `cancelled` - Cancelled
    EventUpdate:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
        venue:
          type: string
          maxLength: 255
        city:
          type: string
          maxLength: 100
        start_datetime:
          type: string
          format: date-time
        end_datetime:
          type: string
          format: date-time
        capacity:
          type: integer
          maximum: 2147483647
          minimum: 0
        ticket_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
      required:
      - capacity
      - city
      - description
      - end_datetime
      - start_datetime
      - title
      - venue
    Login:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
          writeOnly: true
      required:
      - password
      - username
    OrganizerBooking:
      type: object
      properties:
        booking_reference:
          type: string
          readOnly: true
        attendee_username:
          type: string
          readOnly: true
        attendee_email:
          type: string
          format: email
          readOnly: true
        seats:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/Status637Enum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - attendee_email
      - attendee_username
      - booking_reference
      - created_at
      - seats
      - status
    PaginatedEventList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Event'
    PaginatedOrganizerBookingList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/OrganizerBooking'
    Register:
      type: object
      properties:
        username:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          default: attendee
      required:
      - email
      - password
      - username
    RoleEnum:
      enum:
      - organizer
      - attendee
      type: string
      description: |-
        * `organizer` - Organizer
        * `attendee` - Attendee
    Status637Enum:
      enum:
      - confirmed
      - cancelled
      type: string
      description: |-
        * `confirmed` - Confirmed
        * `cancelled` - Cancelled
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
      required:
      - refresh
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
